<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Slide 17 · Thank You / Open Forum</title>
<link rel="stylesheet" href="theme.css">
<link rel="stylesheet" href="section.css">
<style>
  .section .shade {
    background:
      linear-gradient(90deg, rgba(11, 36, 27, 0.96) 0%, rgba(11, 36, 27, 0.86) 30%, rgba(11, 36, 27, 0.1) 52%),
      linear-gradient(0deg, rgba(11, 36, 27, 0.85) 0%, rgba(11, 36, 27, 0) 30%);
  }
  .section .copy { bottom: 150px; }
  .section h1 { font-size: 150px; }
  .section .tease { max-width: 680px; }

  .closing { position: absolute; left: 120px; right: 120px; bottom: 70px; display: flex; align-items: flex-end; justify-content: space-between; gap: 40px; padding-top: 26px; border-top: 1.5px solid rgba(255, 255, 255, 0.18); }
  .closing .k { font-family: var(--mono); font-size: 17px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: #9fb8ab; }
  .closing .names { margin-top: 8px; font-size: 25px; font-weight: 600; color: #eef5f0; }
  .closing .brand { display: flex; align-items: center; gap: 14px; font-size: 22px; color: #d5e5da; text-align: right; }
  .closing .brand img { width: 56px; height: 56px; border-radius: 50%; background: #fff; padding: 3px; }
</style>
</head>
<body data-frame="none">
<div class="slide section">
  <img class="photo" src="../../figures/flow/section-2-solution.jpg" alt=""
       onerror="this.closest('.slide').classList.add('no-photo'); this.remove();">
  <div class="shade"></div>

  <div class="copy">
    <div class="part"><span>Q&amp;A</span>Open Forum</div>
    <h1>Thank you</h1>
    <p class="tease">We welcome your questions, comments and suggestions.</p>
  </div>

  <div class="closing">
    <div>
      <div class="k">Researchers</div>
      <div class="names">Lester Dann G. Lopez · Rhoan Joy M. Marvilla · Prince Daniel A. Valentino · Joshua Jing A. Fernandez</div>
    </div>
    <div class="brand">
      <div>Adviser: Bernadeth B. Liggayu, MIT<br>NVSU · CITE · BSCS 4B</div>
      <img src="../../figures/nvsu-logo.jpg" alt="NVSU logo">
    </div>
  </div>
</div>
<script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js"></script>
<script src="frame.js"></script>
</body>
</html>
